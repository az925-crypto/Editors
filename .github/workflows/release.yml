name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        if: env.RELEASE_KEYSTORE_B64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "${{ runner.temp }}/release.keystore"
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}

      - name: Build Release
        run: ./gradlew --stacktrace assembleRelease
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASS: ${{ secrets.RELEASE_STORE_PASS }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASS: ${{ secrets.RELEASE_KEY_PASS }}

      - name: Prepare Release Assets
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          VERSION="${GITHUB_REF_NAME#v}"
          cp "$APK_PATH" "zaaam-editors-${VERSION}.apk"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "RELEASE_NAME=zaaam-editors-${VERSION}.apk" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_NAME }}
          name: "zaaam/editors ${{ github.ref_name }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}